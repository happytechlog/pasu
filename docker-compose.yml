# Development:  docker compose up -d --wait            → db + mailpit only (run web/worker with npm)
# Full stack:   docker compose --profile app up -d --build --wait
#               → also migrate (one-shot) → web (http://localhost:3000) + worker
# The app services read BETTER_AUTH_SECRET etc. from .env via interpolation;
# DATABASE_URL is overridden to point at the db service. SMTP_HOST/SMTP_PORT come from .env
# (default: the mailpit service). Note: inside a container "localhost" is the container itself.

x-app-env: &app-env
  DATABASE_URL: postgres://monitor:monitor@db:5432/monitor
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-Pasu Monitor <alerts@localhost>}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  migrate:
    profiles: [app]
    build: { context: ., target: worker }
    image: pasu-worker
    command: ["node", "migrate.mjs"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., target: web }
    image: pasu-web
    restart: unless-stopped
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    image: pasu-worker
    restart: unless-stopped
    environment: *app-env
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  pgdata:
