# Development:  docker compose up -d --wait            → db + mailpit only (run web/worker with npm)
# Full stack:   docker compose --profile app up -d --build --wait
#               → also migrate (one-shot) → web (http://localhost:3000) + worker
# The app services read BETTER_AUTH_SECRET etc. from .env via interpolation;
# DATABASE_URL is overridden to point at the db service. SMTP_HOST/SMTP_PORT come from .env
# (default: the mailpit service). Note: inside a container "localhost" is the container itself.
# This is the DEVELOPMENT stack: the DB password defaults to "monitor" so it starts without a .env.
# For production use docker-compose.prod.yml, which requires every secret.

x-app-env: &app-env
  DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD:-monitor}@db:5432/monitor
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-Pasu Monitor <alerts@localhost>}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  MONITOR_ALLOWED_NETWORKS: ${MONITOR_ALLOWED_NETWORKS:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      POSTGRES_DB: monitor
    ports:
      # Loopback only: the dev DB password is a well-known default. DB_PORT changes the host side only
      # (e.g. when another PostgreSQL already uses 5432); containers still reach it as db:5432.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      # Loopback only: the Mailpit UI has no auth and shows invitation links. Don't publish these in production.
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

  migrate:
    profiles: [app]
    build: { context: ., target: worker }
    image: pasu-worker
    command: ["node", "migrate.mjs"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., target: web }
    image: pasu-web
    restart: unless-stopped
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    ports:
      # Host side only: WEB_PORT is the port on the server, 3000 is fixed inside the container (Dockerfile
      # PORT and healthcheck), so never change the Dockerfile to move the port. WEB_BIND limits the host
      # address (e.g. 127.0.0.1 behind nginx); unset = all interfaces, IPv4 and IPv6, as before.
      - "${WEB_BIND:+${WEB_BIND}:}${WEB_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    image: pasu-worker
    restart: unless-stopped
    environment: *app-env
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  pgdata:
